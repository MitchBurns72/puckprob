name: Purge (une fois)

# Efface tirs-nhl.zip de TOUT l'historique de puckprob (téléversé ici par erreur le 10 nov. 2026 : le code privé ne
# doit jamais être public). Réécrit seulement les commits depuis cet upload, puis pousse de force. Le site ne change
# pas. Une fois que c'est vert : supprime ce fichier (purge.yml).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enlever tirs-nhl.zip de l'historique et pousser
        run: |
          pip install -q git-filter-repo
          git config user.name "puckprob-bot"
          git config user.email "puckprob-bot@users.noreply.github.com"
          echo "Commits qui touchent tirs-nhl.zip :"
          git log --format='%h %ci %s' -- tirs-nhl.zip
          url=$(git remote get-url origin)
          for essai in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            git filter-repo --path tirs-nhl.zip --invert-paths --force
            git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
            if git push --force origin HEAD:main; then echo "PURGÉ"; break; fi
            echo "le job Live a poussé entre-temps, on recommence ($essai)"; sleep 5
          done
          echo "Reste-t-il quelque chose ?"; git log --format='%h %s' -- tirs-nhl.zip | head
