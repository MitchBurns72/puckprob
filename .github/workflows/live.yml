name: Live

# Scores en direct + fil du soir (Facebook / Instagram). Écrit live.json et social_poste.json à la racine du site.
# Le code (live_code/) est envoyé ici par le calcul de Tirs-nhl.
# Avant : un passage aux 5 min, mais GitHub en sautait presque tous (8 nov. 2026 : 1 passage en 3 heures, les posts
# du soir restaient pris). Maintenant : UN passage qui reste allumé et boucle lui-même aux 5 min (scores, posts,
# commit), jusqu'à 2 h du matin. Les relances aux heures servent de filet : si le passage n'a pas démarré ou a fini
# son temps max (près de 6 h), la suivante prend le relais ; s'il tourne déjà, elle attend derrière (concurrency).
# Secrets du dépôt puckprob : META_PAGE_TOKEN, META_PAGE_ID, META_IG_ID.
on:
  schedule:
    - cron: "3 17-23 * * *"
    - cron: "3 0-5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boucle aux 5 minutes (scores en direct + fil du soir)
        env:
          LIVE_SORTIE: live.json
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
        run: |
          git config user.name "puckprob-bot"
          git config user.email "puckprob-bot@users.noreply.github.com"
          fin=$(( $(date +%s) + 345 * 60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            h=$((10#$(TZ=America/Toronto date +%H)))
            # De 2 h à 11 h (heure de l'Est) : pas de match ni de post, on arrête
            if [ "$h" -ge 2 ] && [ "$h" -lt 11 ]; then echo "fini pour la nuit"; break; fi
            # Le calcul de Tirs-nhl pousse ici (site, fil du soir, code) : on prend la dernière version à chaque tour
            git pull --rebase --autostash -q || echo "pull : raté, on continue"
            python live_code/live.py || echo "live : erreur"
            if [ -f live_code/poster.py ]; then python live_code/poster.py || echo "fil : erreur"; fi
            git add live.json 2>/dev/null || true
            if [ -f social_poste.json ]; then git add social_poste.json; fi
            if ! git diff --cached --quiet; then
              git commit -q -m "Live $(date -u +%H:%MZ)"
              for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done
            fi
            sleep $(( 300 - $(date +%s) % 300 ))
          done
