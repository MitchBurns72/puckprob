name: Miroir du site

# Copie le site calculé dans Tirs-nhl (docs/public/) aux 20 minutes.
# Rien ne change = rien n'est commité (ça roule en 15 secondes).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: miroir
  cancel-in-progress: false

jobs:
  miroir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copier le site
        run: python miroir.py
      - name: Committer si ça a bougé
        run: |
          git config user.name "puckprob-bot"
          git config user.email "puckprob-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "Site $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
